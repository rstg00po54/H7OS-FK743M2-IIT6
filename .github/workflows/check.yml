name: Validate source overlays
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and overlay tests
        run: |
          python3 -m py_compile scripts/prepare.py scripts/patch_startup.py
          python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n scripts/build.sh
          bash -n scripts/setup_deps.sh
          bash -n scripts/install_env_github.sh
      - name: Generate pinned FK743M2 BSP (source integration)
        run: |
          python3 scripts/prepare.py
          python3 -m unittest discover -s tests -v
          grep -q 'CONFIG_RT_CONSOLE_DEVICE_NAME="vcom"' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/.config
          grep -q '#define HAL_PCD_MODULE_ENABLED' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/board/CubeMX_Config/Inc/stm32h7xx_hal_conf.h
          grep -q 'RCC_USBCLKSOURCE_HSI48' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/board/board.c
          grep -Fq "if GetDepend(['BSP_USING_UART']):" third_party/rt-thread/bsp/stm32/libraries/HAL_Drivers/drivers/SConscript
          grep -q '#ifdef BSP_USING_UART' third_party/rt-thread/bsp/stm32/libraries/HAL_Drivers/drv_common.c
          if grep -q 'h7os_early_dfu_check();' third_party/rt-thread/bsp/stm32/libraries/HAL_Drivers/drv_common.c; then
            echo "Obsolete late DFU hook remains in drv_common.c" >&2
            exit 1
          fi
          grep -q 'return finsh_prompt;' third_party/rt-thread/components/finsh/shell.c
          grep -q 'CONFIG_RT_USING_DFS_TMPFS=y' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/.config
          grep -q '#define RT_USING_DFS_TMPFS' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/rtconfig.h
          grep -q 'CONFIG_BSP_USING_SDRAM=y' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/.config
          grep -q '#define HAL_SDRAM_MODULE_ENABLED' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/board/CubeMX_Config/Inc/stm32h7xx_hal_conf.h
          grep -Fq "if GetDepend('BSP_USING_SDRAM_DRIVER'):" third_party/rt-thread/bsp/stm32/libraries/HAL_Drivers/drivers/SConscript
          grep -q 'HAL_SDRAM_MspInit' third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/board/CubeMX_Config/Src/stm32h7xx_hal_msp.c
          grep -Fq 'iter->dev_id ? iter->dev_id->parent.name' third_party/rt-thread/components/finsh/msh_file.c
          python3 scripts/prepare.py --no-clone
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GNU toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv scons gcc-arm-none-eabi
      - name: Generate board support package
        run: python3 scripts/prepare.py
      - name: Install RT-Thread Env from GitHub
        run: bash scripts/install_env_github.sh
      - name: Fetch HAL/CMSIS dependencies
        run: bash scripts/setup_deps.sh
      - name: Cross-compile H7OS firmware
        run: |
          bash scripts/build.sh
          grep -Fq 'bl  h7os_early_dfu_check' third_party/rt-thread/bsp/stm32/libraries/stm32h7_cmsis_driver-latest/Source/Templates/gcc/startup_stm32h743xx.s
          python3 scripts/patch_startup.py
          arm-none-eabi-nm third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/rt-thread.elf > /tmp/h7os-symbols.txt
          grep -F ' h7os_early_dfu_check' /tmp/h7os-symbols.txt
          grep -F ' dfs_mount' /tmp/h7os-symbols.txt
          grep -F ' dfs_tmpfs_mount' /tmp/h7os-symbols.txt
          grep -F ' HAL_SDRAM_Init' /tmp/h7os-symbols.txt
          grep -F ' HAL_SDRAM_MspInit' /tmp/h7os-symbols.txt
      - name: Upload firmware images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H7OS-FK743M2-IIT6-sdram-unverified
          path: |
            third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/rt-thread.elf
            third_party/rt-thread/bsp/stm32/stm32h743-fk743m2-iit6/rtthread.bin
          if-no-files-found: error
          retention-days: 7
